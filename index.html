<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Fake Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Enter Your Username</h2>
    <input id="username" placeholder="3–8 letters, no symbols" maxlength="8" />
    <button onclick="startChat()">Start Chat</button>

    <div id="chatSection" class="hidden">
      <div id="chatBox"></div>
      <div class="inputBar">
        <input id="chatInput" type="text" placeholder="Text..." />
        <button onclick="sendMessage()">SEND</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
